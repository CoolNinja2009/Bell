#  Bell Relay Controller — Configuration
#  =========================================
#  Change values after the = sign, then restart the server.
#  Lines starting with # are comments and are ignored.
#  For numbers, just write the number (no quotes needed).
#  For text, write the value directly (no quotes needed).
#  Section headers like [Repository] group related settings.


[Repository]
# GitHub repo to pull updates from
url               = https://github.com/CoolNinja2009/Bell.git
remote            = origin
branch            = main
# How many times to retry a failed git fetch
fetch_retries     = 3
# Seconds to wait between fetch retries
fetch_retry_delay = 5


[PM2]
# Name shown in `pm2 list` — must match ecosystem.config.js
process_name        = relay-server
# PM2 ecosystem config filename
ecosystem_file      = ecosystem.config.js
# Seconds to wait after restart before checking health
startup_grace       = 5


[Health]
# URL checked to confirm the server is alive
url           = http://127.0.0.1:8080/health
# Seconds to wait for a health check response
timeout       = 10
# How many times to retry before giving up
retries       = 10
# Seconds to wait between retries
retry_delay   = 2


[Logging]
# Maximum size of a log file before rotation (in bytes)
max_log_size = 1048576
# Number of rotated backup files to keep
max_log_files = 5


[Server]
# Address the web server listens on (0.0.0.0 = all network interfaces)
host = 0.0.0.0
# Port for the dashboard and API
port = 8080


[Beacon]
# UDP port used to broadcast server location to ESP32 devices
port         = 9999
# How often the beacon is sent (milliseconds)
interval_ms  = 5000


[ProfileRefresh]
# How often to check for midnight profile rollover (milliseconds)
interval_ms = 60000


[Channels]
# Maximum number of relay channels allowed
max_channels = 24
# Pattern that valid channel names must match
key_pattern  = ^[a-zA-Z][a-zA-Z0-9_-]{0,19}$


[Firmware]
# GitHub owner/repo where firmware releases are hosted
# Also settable via FIRMWARE_REPO environment variable
repo        = CoolNinja2009/Bell
# Asset filename in the GitHub release
# Also settable via FIRMWARE_ASSET_NAME environment variable
asset_name  = firmware.bin
# Minutes before re-checking GitHub (happens automatically when ESP32 asks for firmware)
cache_minutes = 30


[Cron]
# When to run the daily restart (crontab format: minute hour day month weekday)
daily_check    = 30 16 * * *
# Shell command for the cron job — {root} is replaced with the server directory
update_command = cd {root} && bash start.sh --update >> /tmp/bell-cron.log 2>&1
