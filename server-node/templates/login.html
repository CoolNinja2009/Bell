<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/bell.svg">
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00a87a">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Controller — Login</title>
<style>
  /* ── Design Tokens ─────────────────────── */
  :root {
    --bg:       #0a0f16;
    --panel:    #111921;
    --border:   #1e2936;
    --text:     #e2e8f0;
    --dim:      #64748b;
    --accent:   #10b981;
    --danger:   #ef4444;
    --radius:   10px;
    --shadow:   0 4px 12px rgba(0, 0, 0, 0.4);
  }

  [data-theme="dark"] {
    --bg:       #0a0f16;
    --panel:    #111921;
    --border:   #1e2936;
    --text:     #e2e8f0;
    --dim:      #64748b;
    --accent:   #10b981;
    --danger:   #ef4444;
    --radius:   10px;
    --shadow:   0 4px 12px rgba(0, 0, 0, 0.4);
  }

  [data-theme="light"] {
    --bg:       #f8fafc;
    --panel:    #ffffff;
    --border:   #e2e8f0;
    --text:     #0f172a;
    --dim:      #64748b;
    --accent:   #10b981;
    --danger:   #ef4444;
    --radius:   10px;
    --shadow:   0 4px 12px rgba(0, 0, 0, 0.08);
  }

  /* ── Base ──────────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse at 50% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Card ──────────────────────────────── */
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 32px;
    box-shadow: var(--shadow);
  }

  /* ── Heading ───────────────────────────── */
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    color: var(--text);
  }

  h1::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 12px var(--accent);
  }

  /* ── Form ──────────────────────────────── */
  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--dim);
    margin-bottom: 8px;
  }

  input[type="password"] {
    width: 100%;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 20px;
    transition: all 0.2s ease;
  }

  input[type="password"]:hover {
    border-color: rgba(16, 185, 129, 0.3);
  }

  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
  }

  /* ── Button ────────────────────────────── */
  button {
    width: 100%;
    min-height: 44px;
    background: linear-gradient(135deg, var(--accent), #059669);
    color: #ffffff;
    border: none;
    border-radius: var(--radius);
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }

  button:active {
    transform: translateY(0);
  }

  /* ── Error ─────────────────────────────── */
  .error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 0.875rem;
    margin-bottom: 20px;
  }

  /* ── Footer ────────────────────────────── */
  .site-footer {
    text-align: center;
    padding: 32px 16px 0;
    font-size: 0.75rem;
    color: var(--dim);
    letter-spacing: 0.3px;
    opacity: 0.6;
    transition: opacity 0.3s ease;
  }

  .site-footer:hover {
    opacity: 1;
  }

  /* ── Responsive ────────────────────────── */
  @media (max-width: 480px) {
    body {
      padding: 16px;
    }

    .card {
      padding: 32px 24px;
    }

    h1 {
      font-size: 1.125rem;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Relay Controller</h1>
    <!--ERROR_BLOCK-->
    <form method="POST" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit">Log in</button>
    </form>
  </div>

<footer class="site-footer">&#x1F514; Built from silicon to server. &mdash; Chinmayakeshav</footer>

<!-- ── Service Worker ─────────────────────────────────────────────── -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { scope: '/' });
}
</script>
</body>
</html>
