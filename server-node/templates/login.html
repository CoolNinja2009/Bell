<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f16" media="(prefers-color-scheme: dark)">
<title>Sign in — Relay Controller</title>
<link rel="icon" type="image/svg+xml" href="/bell.svg">
<link rel="manifest" href="/manifest.json">
<script>
  // Apply the saved/system theme before first paint (no light/dark flash).
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="/assets/ui.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div>
          <h1>Relay Controller</h1>
          <p>Sign in to manage the bell schedule</p>
        </div>
      </div>
      <!--ERROR_BLOCK-->
      <form method="POST" action="/login" id="login-form">
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-save btn-block" id="login-btn">Sign in</button>
      </form>
    </div>

    <footer class="site-footer">
      <p>Built from silicon to server. &mdash; Chinmayakeshav</p>
      <div class="footer-links">
        <a href="https://github.com/CoolNinja2009" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://github.com/CoolNinja2009?tab=repositories" target="_blank" rel="noopener noreferrer">Projects</a>
        <span>ESP32 + Node.js</span>
        <a href="https://www.gnu.org/licenses/gpl-3.0.en.html" target="_blank" rel="noopener noreferrer">GPL-3.0 License</a>
      </div>
    </footer>
  </main>

<script>
(function () {
  var form = document.getElementById('login-form');
  var pw = document.getElementById('password');
  var toggle = document.getElementById('pw-toggle');
  var btn = document.getElementById('login-btn');

  // Keep the ?next= destination (set when a protected page redirected here)
  // across the POST so the user lands where they were going.
  if (location.search.indexOf('next=') !== -1) form.setAttribute('action', '/login' + location.search);

  toggle.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    pw.focus();
  });

  // Visible feedback + guard against double submits on a slow Pi.
  form.addEventListener('submit', function () {
    btn.classList.add('is-pending');
    btn.setAttribute('aria-busy', 'true');
  });
  window.addEventListener('pageshow', function () { btn.classList.remove('is-pending'); btn.removeAttribute('aria-busy'); });
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { scope: '/' });
}
</script>
</body>
</html>
