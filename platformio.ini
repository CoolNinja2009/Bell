;git a; PlatformIO Project Configuration File
; ─────────────────────────────────────
; Target:  ESP32 DevKit  (change `board` below for your board)
;
; Quick start:
;   pio run              — compile
;   pio run -t upload    — compile + flash
;   pio device monitor   — serial console

[env:esp32dev]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
extra_scripts =
    pre:build_metadata.py
    post_upload.py

; ── Library dependencies ─────────────────────────────────────────
lib_deps =
    bblanchon/ArduinoJson @ ^7
    adafruit/RTClib @ ^2
; Uncomment below to enable Serial diagnostics at compile time:
; build_flags =
;     -D DEBUG_SERIAL

; ── OTA identity (version injected by CI, default for local builds) ─
; ── OTA identity + feature flags ─────────────────────────────────
; Uncomment to enable the independent relay watchdog:
; build_flags =
;     -D FIRMWARE_VERSION=\"0.0.0-dev\"
;     -D WATCHDOG_ENABLED
build_flags =
    -D FIRMWARE_VERSION=\"0.0.0-dev\"
upload_port   = COM3
upload_speed  = 460800
