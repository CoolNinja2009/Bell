;git a; PlatformIO Project Configuration File
; ─────────────────────────────────────
; Target:  ESP32 DevKit  (change `board` below for your board)
;
; Quick start:
;   pio run              — compile
;   pio run -t upload    — compile + flash
;   pio device monitor   — serial console

[env:esp32dev]
; Toolchain is PINNED on purpose. An unpinned `espressif32` resolves to the
; newest platform at build time, and espressif32 v8 ships Arduino-ESP32 3.x,
; which removed ledcSetup()/ledcAttachPin() (used by led_indicator.cpp) and
; broke CI. 6.13.0 = Arduino-ESP32 2.0.17 - the exact core the devices run and
; the firmware was validated with. To upgrade, port the 3.x API changes first
; and test on hardware, then bump this line deliberately.
platform     = espressif32@6.13.0
board        = esp32dev
framework    = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
extra_scripts =
    pre:build_metadata.py
    post_upload.py

; ── Library dependencies ─────────────────────────────────────────
; Exact versions (RTClib's Adafruit BusIO dependency included) so a rebuilt
; release is byte-for-byte reproducible from the same sources.
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/RTClib @ 2.1.4
    adafruit/Adafruit BusIO @ 1.17.4
; Uncomment below to enable Serial diagnostics at compile time:
; build_flags =
;     -D DEBUG_SERIAL

; ── OTA identity (version injected by CI, default for local builds) ─
build_flags =
    -D FIRMWARE_VERSION=\"0.0.0-dev\"
upload_port   = COM3
upload_speed  = 460800
