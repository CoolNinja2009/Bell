name: Build & Release Firmware

# ── Triggers ────────────────────────────────────────────────────────
# Only rebuild firmware when ESP32 source files actually change.
# Tags always trigger. workflow_dispatch is the manual escape hatch.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'partitions_ota.csv'
      - 'platformio.ini'
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(date +%Y.%m%d).${GITHUB_SHA::7}"
          fi
          COMPILED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "compiled_at=$COMPILED_AT" >> $GITHUB_OUTPUT
          echo "Building firmware v$VER compiled at $COMPILED_AT"

      - name: Build firmware
        env:
          PLATFORMIO_BUILD_FLAGS: -D FIRMWARE_VERSION='"${{ steps.version.outputs.version }}"'
          FIRMWARE_BUILD_STAMP: ${{ steps.version.outputs.compiled_at }}
        run: |
          pio run

      - name: Compute SHA-256
        id: sha
        run: |
          BIN=".pio/build/esp32dev/firmware.bin"
          cp "$BIN" firmware.bin
          SHA=$(sha256sum firmware.bin | awk '{print $1}')
          printf '%s  firmware.bin\n' "$SHA" > firmware.bin.sha256
          cat > firmware-manifest.json <<EOF
          {
            "schema_version": 1,
            "version": "${{ steps.version.outputs.version }}",
            "compiled_at": "${{ steps.version.outputs.compiled_at }}",
            "sha256": "$SHA",
            "size": $(stat -c%s firmware.bin),
            "ota_protocol": 2,
            "min_ota_protocol": 1,
            "target": "esp32dev"
          }
          EOF
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "SHA-256: $SHA"

      - name: Verify embedded OTA metadata
        run: |
          grep -a -F "BELL_BUILD:${{ steps.version.outputs.compiled_at }}" firmware.bin
          grep -a -F "BELL_OTA_PROTOCOL:2" firmware.bin
          grep -a -F "BELL_OTA_MIN_PROTOCOL:1" firmware.bin

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: |
            firmware.bin
            firmware.bin.sha256
            firmware-manifest.json
          body: |
            ## Firmware v${{ steps.version.outputs.version }}

            | Property | Value |
            |----------|-------|
             | Version  | `${{ steps.version.outputs.version }}` |
             | Compiled | `${{ steps.version.outputs.compiled_at }}` |
            | SHA-256  | `${{ steps.sha.outputs.sha256 }}` |
            | Target   | ESP32 DevKit (`esp32dev`) |

            ### Auto-OTA
            ESP32 devices check every morning (3 AM local time) for new firmware.
            If a newer version is found, they download, verify SHA-256, and apply
            the update automatically — no manual intervention needed.

            Just push to `main`. That's it.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
