name: Verify Bell Controller

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server-node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check server.js
      - run: npm audit --omit=dev --audit-level=high

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio
      - run: pio run
      - run: |
          strings .pio/build/esp32dev/firmware.bin | grep -F 'BELL_OTA_PROTOCOL:2'
          strings .pio/build/esp32dev/firmware.bin | grep -F 'BELL_OTA_MIN_PROTOCOL:1'
